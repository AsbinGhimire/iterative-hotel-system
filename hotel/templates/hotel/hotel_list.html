{% extends 'hotel/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Managed Hotels</h2>
    <a href="{% url 'hotel_add' %}" class="btn btn-primary">Add New Hotel</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Total Rooms</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for hotel in object_list %}
                <tr>
                    <td>{{ hotel.name }}</td>
                    <td>{{ hotel.location }}</td>
                    <td>{{ hotel.total_rooms }}</td>
                    <td>
                        <a href="{% url 'hotel_edit' hotel.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <a href="{% url 'hotel_delete' hotel.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted">No hotels registered yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
