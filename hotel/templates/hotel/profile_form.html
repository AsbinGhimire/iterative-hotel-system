{% extends 'hotel/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card form-card shadow-lg border-0">
            <div class="form-header text-center">
                <div class="icon-box icon-box-lg bg-primary text-white mx-auto mb-3">
                    <i data-lucide="camera" class="premium-icon"></i>
                </div>
                <h2 class="fw-bold">Update Profile Photo</h2>
                <p class="text-muted">Choose a clear photo to personalize your profile</p>
            </div>
            <div class="card-body p-4 p-lg-5">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="{{ form.profile_photo.id_for_label }}" class="form-label fw-bold">Select Image</label>
                        {{ form.profile_photo }}
                        {% if form.profile_photo.errors %}
                            <div class="text-danger small mt-1">{{ form.profile_photo.errors }}</div>
                        {% endif %}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-gradient-primary">
                            <i data-lucide="save" class="me-2" style="width: 18px;"></i>Save Changes
                        </button>
                        <a href="{% url 'profile' %}" class="btn btn-light rounded-pill">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
