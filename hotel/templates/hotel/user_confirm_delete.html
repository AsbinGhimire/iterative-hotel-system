{% extends 'hotel/base.html' %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-5">
        <div class="card form-card shadow-lg border-0 text-center">
            <div class="form-header bg-white p-5 border-0">
                <div class="icon-box icon-box-lg bg-danger text-white mx-auto mb-4 shadow-sm">
                    <i data-lucide="user-minus" class="premium-icon"></i>
                </div>
                <h2 class="fw-bold text-dark">Delete User?</h2>
                <p class="text-muted">Are you sure you want to delete the user <strong>"{{ object.username }}"</strong>? This action cannot be undone.</p>
            </div>
            <div class="card-body p-4 p-lg-5 pt-0">
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger rounded-pill py-3 fw-bold shadow-sm">
                            <i data-lucide="trash-2" class="me-2" style="width: 18px;"></i>Confirm Delete
                        </button>
                        <a href="{% url 'user_list' %}" class="btn btn-light rounded-pill py-3 text-muted">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .animate-fade-in {
        animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
